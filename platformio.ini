; ThermoTrace Edge — nodo IoT ESP32 DevKitC V4
; Responsable: Brenda Lucía Gamio Upiachihua (capa Edge / Firmware / QA)
;
; Entornos:
;   esp32dev → firmware del local (producción del piloto)
;   demo     → MISMO firmware + inyección de excursiones SIMULADAS
;              ("simulated": true, device_id ESP32_DEMO_01). Solo para la
;              demo/sustentación; nunca se instala en Boticas Perú.
;   native   → pruebas unitarias de src/core/ en el PC (Unity)

[platformio]
default_envs = esp32dev

[env]
build_flags =
    -Wall

; -------------------------------------------------------------------------
[env:esp32dev]
; Versión FIJADA (IOT-003): pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12
; sobre ESP-IDF 5.5.5, con soporte vigente. La rama ESP-IDF 4.4 (Arduino
; 2.0.17) está fuera de soporte desde julio de 2024 (Espressif AR2024-008):
; sin parches de Wi-Fi, mbedTLS ni LwIP. La plataforma oficial de PlatformIO
; no ofrece Arduino 3.x; pioarduino es su continuación comunitaria. Se fija
; por versión exacta, nunca por el alias `stable`, que se mueve.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, log2file
upload_speed = 921600

; Solo dos librerías externas. El SHT31 se habla directo por I²C (CRC propio)
; y el DS18B20 por OneWire (scratchpad + CRC propio), sin DallasTemperature
; ni Adafruit, para controlar timeout, CRC y motivo de falla.
; 256dpi/MQTT: publicación QoS 1 que devuelve true SOLO con el PUBACK.
; IOT-010: versiones EXACTAS. Con rangos (^2.5.2) una compilación posterior
; resolvía ya 2.5.3 sin que nadie lo decidiera.
lib_deps =
    paulstoffregen/OneWire @ 2.3.8
    256dpi/MQTT @ 2.5.3

build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
    ; Por nodo (descomentar y ajustar):
    ; -DDEVICE_ID=\"ESP32_FARMACIA_01\"
    ; -DMC38_INSTALADO=0
    ; -DSENSADO_ENERGIA_INSTALADO=1
    ; -DAUTONOMIA_RESPALDO_MEDIDA_MIN=180

; 4 MB: app0/app1 1280 KB (OTA), littlefs 1472 KB (ver partitions.csv).
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; IOT-001: la CA del broker se embebe en la imagen si existe
; data/certs/root_ca.pem (ver scripts/embeber_ca.py).
extra_scripts = pre:scripts/embeber_ca.py

; -------------------------------------------------------------------------
[env:demo]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DMODO_DEMO=1
    -DDEVICE_ID=\"ESP32_DEMO_01\"

; -------------------------------------------------------------------------
; IOT-001: firmware de PRODUCCIÓN endurecido (Secure Boot v2, Flash Encryption
; release, NVS Encryption, descarga UART desactivada, CA embebida obligatoria).
; Recompila el framework con custom_sdkconfig (hybrid compile de pioarduino).
; Su PRIMER ARRANQUE quema eFuses de forma IRREVERSIBLE: seguir
; docs/seguridad_produccion.md. Los binarios salen SIN firmar (firma externa).
[env:produccion]
extends = env:esp32dev
custom_sdkconfig = file://seguridad_produccion.sdkconfig
board_build.partitions = partitions_produccion.csv
build_flags =
    ${env:esp32dev.build_flags}
    -DEXIGIR_CA_EMBEBIDA=1

; -------------------------------------------------------------------------
; `pio test -e native` exige gcc/g++ en el PATH. En Windows sin MinGW usar
; scripts\tests_nativos_msvc.cmd (Visual Studio 2022).
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
