name: firmware-edge
on: [push, pull_request]
jobs:
  pruebas-y-compilacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio pydantic
      - name: Pruebas nativas de src/core (Unity)
        run: pio test -e native
      - name: Compilar firmware del local y firmware demo
        run: pio run -e esp32dev -e demo
