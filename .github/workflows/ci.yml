name: firmware-edge
on: [push, pull_request]
jobs:
  pruebas-y-compilacion:
    runs-on: ubuntu-latest
    steps:
      # IOT-010: acciones fijadas por SHA de commit (las etiquetas se mueven).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Versión exacta de PlatformIO; la plataforma y las librerías están
      # fijadas en platformio.ini.
      - run: pip install platformio==6.2.0
      # Compilación reproducible: el core usa __DATE__/__TIME__; GCC los toma
      # de SOURCE_DATE_EPOCH (fecha del commit), así el mismo commit produce
      # el mismo binario y la misma huella en cualquier momento.
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Pruebas nativas de src/core (Unity)
        run: pio test -e native
      - name: Compilar firmware del local y firmware demo
        run: pio run -e esp32dev -e demo
      # IOT-010: huella SHA-256 de cada binario, para registrar la versión
      # liberada (firmware_releases del backend) y comprobar lo instalado.
      - name: Huellas SHA-256 de los binarios
        run: |
          for env in esp32dev demo; do
            sha256sum ".pio/build/$env/firmware.bin" | tee ".pio/build/$env/firmware.bin.sha256"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.bin.sha256
            .pio/build/demo/firmware.bin
            .pio/build/demo/firmware.bin.sha256
